# The desktop shell: the rove-web client in one window, driving the Rove already installed here.
# Ad-hoc signed (no Developer ID yet): a build from a person's own machine opens; a download needs
# `xattr -d com.apple.quarantine /Applications/Rove.app` or right-click › Open.
appId: run.rove.desktop
productName: Rove
copyright: Rove
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - package.json
asar: true
# No version in the name: the landing page links to these files on the rolling `desktop` release.
artifactName: Rove-${os}-${arch}.${ext}
npmRebuild: false
mac:
  category: public.app-category.developer-tools
  # Ad-hoc, not none: skipping signing leaves Electron's own signature, which no longer matches the bundle
  # (`codesign --verify` fails), and macOS keys notification permission to a bundle's signature.
  identity: "-"
  hardenedRuntime: false
  target:
    - target: dmg
      arch:
        - arm64
        - x64
dmg:
  title: Rove
  contents:
    - x: 140
      y: 180
    - x: 400
      y: 180
      type: link
      path: /Applications
win:
  target:
    - nsis
linux:
  target:
    - AppImage
  # The default comes from the scoped package name (`@sma1lboy/rove-desktop`), which is no file name.
  executableName: rove-desktop
  category: Development
