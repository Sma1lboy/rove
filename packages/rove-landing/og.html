<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Rove: share card source</title>
<!-- Source of assets/og-card.jpg. Render at 1200×630 and save as JPEG (see README).
     No version number on purpose: the card is a raster and would go stale on the next release. -->
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/base.css">
<style>
html,body{width:1200px;height:630px;overflow:hidden}
.card{width:1200px;height:630px;padding:56px 72px;display:flex;flex-direction:column;justify-content:space-between}
.card .brand .wm{font-size:24px}
.card h1{font-size:64px;line-height:1.1;max-width:14ch;margin:0 0 40px}
.card .copy{max-width:640px}
.card .copy .cmd{font-size:20px}
.fan{margin-top:8px}
.card .eqn{font-size:20px;color:var(--ink-2)}
</style>
</head>
<body>
<div class="card">
  <span class="brand">
    <svg viewBox="0 0 64 64" width="36" height="36" aria-hidden="true" class="mark"><rect x="1" y="1" width="62" height="62" rx="13"/><path d="M19 13H12V51h7" stroke-width="7"/><path d="M12 13V51" stroke-width="4"/><g transform="translate(19.811 45) scale(.01745 -.01745)"><path class="r" d="M111 0H419V521H689C690 521 691 521 692 521L956 0H1286L987 579C1154 656 1253 804 1253 1001C1253 1301 1043 1490 707 1490H111ZM419 768V1234H688C851 1234 952 1143 952 1001C952 859 851 768 689 768Z"/></g><path d="M45 13h7V51h-7" stroke-width="7"/><path d="M52 13V51" stroke-width="4"/></svg>
    <span class="wm">Rove</span>
  </span>

  <div>
    <h1>The agent multiplexer <span class="thin">in your shell</span></h1>
    <div class="copy"><span class="cmd">curl -fsSL https://rove.run/install.sh | sh</span></div>
  </div>

  <p class="eqn">A managed task is a git worktree, a branch and terminal tabs. macOS, Linux and Windows (WSL). MIT license.</p>
</div>
</body>
</html>
