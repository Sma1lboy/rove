name: RoveMobile
options:
  bundleIdPrefix: run.rove
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: 68562FABX7
    TARGETED_DEVICE_FAMILY: "1"
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.18.0
targets:
  RoveMobile:
    type: application
    platform: iOS
    sources:
      - path: Sources/RoveMobile
      # The demo's page from scripts/build-demo-web.sh, run by hand (the archive Mac has no bun); a folder so its
      # assets/ keeps its paths.
      - path: DemoWeb
        type: folder
        buildPhase: resources
        optional: true
    preBuildScripts:
      - name: Check the demo page is built
        script: |
          [ -f "$SRCROOT/DemoWeb/demo.html" ] || { echo "error: DemoWeb/ is missing. Run packages/rove-ios/scripts/build-demo-web.sh on a Mac with bun, then build again."; exit 1; }
        basedOnDependencyAnalysis: false
    dependencies:
      - package: SwiftTerm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: run.rove.app
        PRODUCT_NAME: RoveMobile
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "2026112702"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Sources/RoveMobile/Info.plist
      properties:
        CFBundleDisplayName: Rove
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # iPhone only: opts out of iPad multitasking, which would otherwise demand all four orientations.
        UIRequiresFullScreen: true
        # The bridge serves plain http:// and ws:// on the LAN / Tailscale, so ATS must allow it.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSCameraUsageDescription: Rove scans the pairing QR code shown by your computer.
        NSLocalNetworkUsageDescription: Rove opens the Rove page served by your computer over the local network.
        # Hold-to-talk dictation in the page (getUserMedia inside WKWebView).
        NSMicrophoneUsageDescription: Rove records your voice while you hold the talk button, to type it into a session.
        # Only system TLS/WSS; no custom or non-exempt cryptography. Skips the export-compliance prompt per build.
        ITSAppUsesNonExemptEncryption: false
        CFBundleIconName: AppIcon
        CFBundleURLTypes:
          - CFBundleURLName: run.rove.app
            CFBundleURLSchemes:
              - rove
        # The terminal's typeface (Terminal/TerminalFont.swift); OFL-1.1, Fonts/OFL.txt.
        UIAppFonts:
          - MapleMono-NF-Regular.ttf
          - MapleMono-NF-Bold.ttf
  RoveMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/RoveMobileTests
    dependencies:
      - target: RoveMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: run.rove.app.tests
        GENERATE_INFOPLIST_FILE: YES
  RoveMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/RoveMobileUITests
    dependencies:
      - target: RoveMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: run.rove.app.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  RoveMobile:
    build:
      targets:
        RoveMobile: all
        RoveMobileTests: [test]
        RoveMobileUITests: [test]
    test:
      targets:
        - RoveMobileTests
        - RoveMobileUITests
