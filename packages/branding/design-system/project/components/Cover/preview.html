<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rove</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--paper); color:var(--ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; width:960px; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .accent { fill:var(--accent); }
  .slab { fill:var(--inset); rx:var(--radius); }
  .second { fill:var(--secondary); rx:var(--radius); }
  .deep { fill:var(--ink); rx:var(--radius); }
  .arm { rx:var(--radius-sm); }
  .dot { fill:var(--line-active); }
  .dot-on { fill:var(--accent); }
  .words { position:absolute; left:40px; bottom:36px; max-width:440px; }
  .name { margin:0; font-family:var(--font-mono); font-size:120px; line-height:.92; font-weight:700; letter-spacing:-.02em; color:var(--ink); }
  .tag { margin:10px 0 0 4px; font-size:14px; line-height:20px; color:var(--muted); }
</style>
</head>

<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      accent: two brackets, each a 40×224 stem + two 88×40 arms (the icon's "[ ]") · inset 208×224 slab between them · secondary 40×128 bleeding off the top right · ink 40×80 bleeding off the bottom right ≈ 27% of 960×288
  arrangement the bracket pair framing one slab, exactly as the wordmark frames "rove"; the two satellites stack on the right edge
  pattern     a literal motif: the web's 3×3 status orb, enlarged to a 7×8 dot grid at a 24px pitch (space-3 × 2) inside the slab, a diagonal lit in accent like a spinner frame; chosen because the status glyph is Rove's one recurring shape
  scales      stems and arms in space-2 multiples (40, 88), gutters space-4 (16px), dot pitch 24px, slab and satellite corners radius (8), arm corners radius-sm (6)
-->
