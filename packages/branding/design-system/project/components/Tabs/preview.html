<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Tabs</title></head>
<body>
<div class="rv-stage rv-col" style="align-items:flex-start">
  <span class="rv-label">pane blurred</span>
  <div class="rv-tabs" role="tablist"><button class="rv-tab" role="tab" aria-selected="true">All</button><button class="rv-tab" role="tab" aria-selected="false">Changes</button></div>
  <span class="rv-label">pane focused</span>
  <div class="rv-pane" tabindex="0" style="outline:none"><div class="rv-tabs" role="tablist"><button class="rv-tab" role="tab" aria-selected="true" style="color:var(--accent)">All</button><button class="rv-tab" role="tab" aria-selected="false">Changes</button></div></div>
</div>
</body>
</html>
