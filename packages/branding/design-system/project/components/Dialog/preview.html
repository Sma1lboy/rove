<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Dialog</title></head>
<body>
<div class="rv-scrim">
<div class="rv-dialog" role="dialog" aria-label="Delete task">
  <div class="rv-dialog-head"><h2 class="rv-dialog-title">Delete “usage-footer”?</h2><button class="rv-close" aria-label="Close">×</button></div>
  <p>The worktree and its branch are removed. Open tabs close.</p>
  <div class="rv-inset-box"><span class="rv-hint">2 uncommitted files will be lost.</span></div>
  <div class="rv-actions"><button class="rv-link">Cancel</button><button class="rv-btn rv-btn--danger">Delete</button></div>
</div></div>
</body>
</html>
