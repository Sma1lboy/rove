<!-- @dsCard group="Status" height=200 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>StatusGlyph</title></head>
<body>
<div class="rv-stage" style="display:grid;grid-template-columns:auto auto auto auto;justify-content:start;gap:6px 28px;font:var(--fs-meta) var(--font-mono)">
  <span class="rv-label">status</span><span class="rv-label">braille</span><span class="rv-label">ascii</span><span class="rv-label">web orb</span>
  <span>running</span><span class="t-accent">⠹</span><span class="t-accent">/</span><span class="rv-orb t-accent"><i class="on"></i><i class="mid"></i><i></i><i class="mid"></i><i class="on"></i><i class="mid"></i><i></i><i class="mid"></i><i class="on"></i></span>
  <span>unseen</span><span class="t-accent">●</span><span class="t-accent">*</span><span class="rv-orb t-accent"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i></span>
  <span>needs input</span><span class="t-warning">?</span><span class="t-warning">?</span><span class="rv-orb t-warning"><i></i><i class="on"></i><i></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i class="on"></i><i></i></span>
  <span>attention</span><span class="t-attention">!</span><span class="t-attention">!</span><span class="rv-orb t-attention"><i class="on"></i><i></i><i class="on"></i><i></i><i class="on"></i><i></i><i class="on"></i><i></i><i class="on"></i></span>
  <span>idle</span><span class="t-muted">○</span><span class="t-muted">o</span><span class="rv-orb" style="color:var(--muted)"><i></i><i></i><i></i><i></i><i class="on"></i><i></i><i></i><i></i><i></i></span>
</div>
</body>
</html>
