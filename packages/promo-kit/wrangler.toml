# kit.sma1lboy.me: team X promo library. Deploy: bunx wrangler deploy
# Secret: bunx wrangler secret put UPLOAD_TOKEN   (same value as PROMO_KIT_TOKEN in ~/.env)
name = "promo-kit"
main = "worker.js"
compatibility_date = "2026-07-01"
workers_dev = false
preview_urls = false

routes = [{ pattern = "kit.sma1lboy.me", custom_domain = true }]

[assets]
directory = "./site"
binding = "ASSETS"
run_worker_first = true

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "promo-kit"

# Fill both once the Access app exists; while empty, every browser request gets a 403.
[vars]
ACCESS_TEAM = ""
ACCESS_AUD = ""
