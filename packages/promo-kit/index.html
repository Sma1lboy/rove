<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rove 宣发包</title>
<link rel="icon" type="image/png" href="../branding/design-system/project/assets/Logos/rove-icon.png">
<link rel="apple-touch-icon" href="../branding/design-system/project/assets/Logos/rove-icon.png">
<!-- theme-color cannot read CSS vars: these are --paper from design-system tokens.json (dark / light). -->
<meta name="theme-color" content="#141413" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#faf9f5" media="(prefers-color-scheme: light)">
<script>document.documentElement.dataset.theme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"</script>
</head>

<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
