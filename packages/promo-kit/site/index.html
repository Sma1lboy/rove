<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>宣发素材 · promo-kit</title>
<link rel="stylesheet" href="/rove-tokens.css">
<script>document.documentElement.dataset.theme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"</script>
<style>
/* Rove design system: colours, sizes, radii come from rove-tokens.css
   (copied from packages/branding/design-system at dev/deploy). No raw hex here. */
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font: var(--fs-body) / 1.5 var(--font-sans), "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; -webkit-text-size-adjust: 100%;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
header { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3) var(--space-5); border-bottom: var(--hairline) solid var(--line); background: var(--paper); position: sticky; top: 0; z-index: var(--z-overlay); }
header .wm { font: 700 var(--fs-title) var(--font-mono); letter-spacing: .02em; color: var(--ink); white-space: nowrap; }
header .wm b { color: var(--accent); font-weight: 700; }
header .wm:hover { text-decoration: none; }
header span { color: var(--subtle); font-size: var(--fs-meta); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
header a.tok { margin-left: auto; font-size: var(--fs-meta); white-space: nowrap; }
main { max-width: 1040px; margin: 0 auto; padding: var(--space-5) var(--space-5) calc(32px + env(safe-area-inset-bottom)); }
h1 { font: 600 var(--fs-display) / 1.4 var(--font-sans); margin: var(--space-2) 0 var(--space-3); }
.muted { color: var(--muted); font-size: var(--fs-meta); }
.meta { color: var(--subtle); font: var(--fs-meta) var(--font-mono); }
.grid { display: grid; gap: var(--space-3\.5); grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
.card { background: var(--surface); border: var(--hairline) solid var(--line); border-radius: var(--radius); overflow: hidden; color: inherit; display: block; }
.card:hover { text-decoration: none; border-color: var(--line-active); }
.card .media { aspect-ratio: 16 / 9; background: var(--inset); display: block; width: 100%; object-fit: cover; }
.card .body { padding: var(--space-2\.5) var(--space-3) var(--space-3); }
.card .t { font-size: var(--fs-title); font-weight: 600; }
.detail { display: grid; gap: var(--space-5); }
@media (min-width: 860px) { .detail { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); align-items: start; } .detail .left { position: sticky; top: 64px; } }
video.player { width: 100%; max-height: 70vh; background: var(--inset); border-radius: var(--radius); display: block; }
.warn { border: var(--hairline) solid var(--line); border-radius: var(--radius-sm); color: var(--warning); padding: var(--space-2) var(--space-3); font-size: var(--fs-meta); margin-top: var(--space-2\.5); }
.warn ul { margin: var(--space-1) 0 0; padding-left: var(--space-4\.5); }
.post { background: var(--surface); border: var(--hairline) solid var(--line); border-radius: var(--radius); padding: var(--space-3); margin-bottom: var(--space-3); }
.post .head { display: flex; justify-content: space-between; align-items: baseline; font: 500 var(--fs-meta) var(--font-sans); color: var(--muted); margin-bottom: var(--space-1\.5); }
.count { font-family: var(--font-mono); color: var(--subtle); }
.count.over { color: var(--error); }
textarea { width: 100%; min-height: 96px; resize: vertical; font-family: inherit; font-size: var(--fs-title); line-height: 1.5; color: var(--ink); background: var(--paper); border: var(--hairline) solid var(--line); border-radius: var(--radius-sm); padding: var(--space-2) var(--space-2\.5); }
textarea:focus-visible { border-color: var(--line-active); outline: none; }
textarea.prompt { min-height: 280px; font: var(--fs-meta) / 1.5 var(--font-mono); }
button:focus-visible, a:focus-visible { outline: var(--hairline) solid var(--focus); outline-offset: 1px; }
.row { display: flex; gap: var(--space-3\.5); flex-wrap: wrap; align-items: center; margin-top: var(--space-2\.5); }
button, .btn { font: inherit; font-size: var(--fs-meta); background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; display: inline-flex; align-items: center; }
button:hover, .btn:hover { text-decoration: underline; }
button.primary { background: var(--accent); color: var(--paper); border-radius: var(--radius-sm); font-weight: 600; padding: var(--space-1\.5) var(--space-3\.5); justify-content: center; }
button.primary:hover { text-decoration: none; }
button:active { transform: scale(0.97); }
button:disabled { opacity: .5; cursor: progress; }
/* touch: 40-44px targets, 16px fields so iOS doesn't zoom */
@media (pointer: coarse) {
  button.primary { min-height: 44px; flex: 1 1 auto; font-size: var(--fs-title); }
  button:not(.primary), .btn { min-height: 40px; padding: 0 var(--space-1\.5); }
  textarea { font-size: var(--fs-display); }
}
.hint { font-size: var(--fs-meta); color: var(--subtle); margin-top: var(--space-2); }
.back { color: var(--muted); font-size: var(--fs-meta); }
#toast {
  position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translate(-50%, 4px);
  max-width: min(92vw, 420px); background: var(--inset); color: var(--ink); border: var(--hairline) solid var(--line);
  padding: var(--space-1\.5) var(--space-3); border-radius: var(--radius-sm); font-size: var(--fs-meta); z-index: var(--z-toast);
  opacity: 0; pointer-events: none; transition: opacity 140ms, transform 180ms cubic-bezier(0.16, 1, 0.3, 1);
}
#toast.on { opacity: 1; transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) { #toast { transition: none; } button:active { transform: none; } }
</style>
</head>
<body>
<header><a class="wm" href="#/"><b>[</b> rove <b>]</b></a><span>宣发素材 · 用你自己的 X 账号发</span><a class="tok" href="#/token">上传令牌</a></header>
<main id="app"><p class="muted">加载中…</p></main>
<div id="toast" role="status" aria-live="polite"></div>
<script type="module">
import { xLength, X_MAX } from "./xcount.js"

const app = document.getElementById("app")
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c])
const vurl = (key) => "/v/" + key
const fmtDur = (s) => (s ? `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, "0")}` : "")
const fmtSize = (b) => (b / 1024 / 1024).toFixed(1) + " MB"
const toastEl = document.getElementById("toast")
let toastTimer
function toast(msg, ms = 4000) {
  toastEl.textContent = msg
  toastEl.classList.add("on")
  clearTimeout(toastTimer)
  toastTimer = setTimeout(() => toastEl.classList.remove("on"), ms)
}
async function copy(text) {
  try { await navigator.clipboard.writeText(text); return true } catch { return false }
}

// Phone = touch screen whose share sheet takes video files (iOS Safari, Android Chrome).
const MOBILE = matchMedia("(pointer: coarse)").matches &&
  !!navigator.canShare?.({ files: [new File([""], "a.mp4", { type: "video/mp4" })] })

let items = null
async function load() {
  const r = await fetch("/api/items")
  if (!r.ok) throw new Error(r.status + " " + (await r.text()))
  items = (await r.json()).items
}

function videoWarnings(v) {
  const w = []
  if (!/\.mp4$/i.test(v.key)) w.push("不是 mp4 文件")
  if (v.codec && !/^avc/.test(v.codec)) w.push(`编码是 ${v.codec}，X 要求 H.264`)
  if (v.duration > 140) w.push(`时长 ${fmtDur(v.duration)}，超过 X 的 2:20 上限`)
  if (v.size > 512 * 1024 * 1024) w.push(`大小 ${fmtSize(v.size)}，超过 X 的 512 MB 上限`)
  return w
}

function renderList() {
  document.title = "宣发素材 · promo-kit"
  if (!items.length) { app.innerHTML = `<p class="muted">还没有素材。</p>`; return }
  app.innerHTML = `<h1>素材</h1><div class="grid">${items.map((it) => `
    <a class="card" href="#/${esc(it.id)}">
      ${it.cover
        ? `<img class="media" src="${vurl(esc(it.cover))}" alt="" loading="lazy">`
        : `<video class="media" src="${vurl(esc(it.video.key))}#t=0.5" preload="metadata" muted playsinline></video>`}
      <div class="body">
        <div class="t">${esc(it.title)}</div>
        <div class="meta">${[fmtDur(it.video.duration), it.posts.length > 1 ? `${it.posts.length} 条串推` : "单条", videoWarnings(it.video).length ? "! 视频规格有问题" : ""].filter(Boolean).join(" · ")}</div>
      </div>
    </a>`).join("")}</div>`
}

function renderDetail(it) {
  document.title = it.title + " · 宣发素材"
  const warns = videoWarnings(it.video)
  const file = it.id + ".mp4"
  app.innerHTML = `
    <a class="back" href="#/">← 全部素材</a>
    <h1>${esc(it.title)}</h1>
    <div class="detail">
      <div class="left">
        <video class="player" src="${vurl(esc(it.video.key))}" ${it.cover ? `poster="${vurl(esc(it.cover))}"` : ""} controls playsinline preload="metadata"></video>
        <div class="meta" style="margin-top:var(--space-1\.5)">${[fmtDur(it.video.duration), fmtSize(it.video.size), it.video.codec].filter(Boolean).join(" · ")}</div>
        <div id="warns"></div>
      </div>
      <div>
        ${it.posts.map((p, i) => `
          <div class="post">
            <div class="head"><span>${it.posts.length > 1 ? `第 ${i + 1} 条${i === 0 ? "（带视频）" : ""}` : "文案"}</span><span class="count" data-i="${i}"></span></div>
            <textarea data-i="${i}" aria-label="第 ${i + 1} 条文案">${esc(p)}</textarea>
            ${i === 0 ? `
              <div class="row">
                <button class="primary" id="send">发到 X</button>
                <a class="btn" href="${vurl(esc(it.video.key))}?dl=${encodeURIComponent(file)}" download="${esc(file)}">下载视频</a>
                <button data-copy="0">复制文案</button>
              </div>
              <div class="hint">${MOBILE
                ? "会打开系统分享面板，选 X。文案同时复制到剪贴板，发帖框里没带上就粘贴。"
                : "会下载视频并打开 X 发帖页（文字已填好），把视频拖进发帖框。"}
              ${it.posts.length > 1 ? "发出去后，在这条下面回复，逐条复制下面的串推。" : ""}</div>`
            : `<div class="row"><button data-copy="${i}">复制第 ${i + 1} 条</button></div>`}
          </div>`).join("")}
        <p class="muted">这里改的文字只在你这一页生效，不会改动素材库。</p>
      </div>
    </div>`

  const areas = [...app.querySelectorAll("textarea")]
  const text = (i) => areas[i].value.trim()
  const recount = (i) => {
    const n = xLength(text(i)), el = app.querySelector(`.count[data-i="${i}"]`)
    el.textContent = `${n} / ${X_MAX}`
    el.classList.toggle("over", n > X_MAX)
    el.title = n > X_MAX ? "超过 X 字数上限（中文按 2 算，链接按 23 算）" : "按 X 规则计数：中文 2，链接 23"
  }
  const fit = (a) => { a.style.height = "auto"; a.style.height = a.scrollHeight + 2 + "px" }
  areas.forEach((a, i) => { recount(i); fit(a); a.addEventListener("input", () => { recount(i); fit(a) }) })

  const warnBox = app.querySelector("#warns")
  const showWarns = (list) => {
    warnBox.innerHTML = list.length ? `<div class="warn">X 可能不收这个视频：<ul>${list.map((w) => `<li>${esc(w)}</li>`).join("")}</ul></div>` : ""
  }
  showWarns(warns)
  const player = app.querySelector("video")
  player.addEventListener("loadedmetadata", () => {
    const r = player.videoWidth / player.videoHeight
    if (r && (r > 2.39 || r < 1 / 2.39)) showWarns([...warns, `画面比例 ${player.videoWidth}×${player.videoHeight}，超出 X 的 1:2.39 – 2.39:1`])
  }, { once: true })

  app.querySelectorAll("[data-copy]").forEach((b) => b.addEventListener("click", async () => {
    const i = Number(b.dataset.copy)
    toast((await copy(text(i))) ? `第 ${i + 1} 条已复制` : "复制失败，长按文本框手动复制")
  }))

  const send = app.querySelector("#send")
  if (MOBILE) {
    // navigator.share must run inside the tap, so the file is fetched ahead of time.
    let videoFile = null
    send.disabled = true
    const total = it.video.size
    ;(async () => {
      const r = await fetch(vurl(it.video.key))
      const reader = r.body.getReader(), chunks = []
      let got = 0
      for (;;) {
        const { done, value } = await reader.read()
        if (done) break
        chunks.push(value); got += value.length
        if (total) send.textContent = `视频准备中 ${Math.round((got / total) * 100)}%`
      }
      videoFile = new File(chunks, file, { type: "video/mp4" })
      send.textContent = "发到 X"
      send.disabled = false
    })().catch(() => { send.textContent = "视频加载失败，点下载视频"; })
    send.addEventListener("click", async () => {
      const t = text(0)
      const copied = copy(t) // started in the same tap as share; not awaited so share keeps the gesture
      try {
        await navigator.share({ files: [videoFile], text: t })
        toast((await copied) ? "文案已复制。X 发帖框里没有文字的话，粘贴即可。" : "X 发帖框里没有文字的话，回来点「复制文案」。", 6000)
      } catch (e) {
        if (e.name !== "AbortError") toast("分享失败：" + e.message + "。可以先下载视频再手动发。", 6000)
      }
    })
  } else {
    send.addEventListener("click", () => {
      const a = document.createElement("a")
      a.href = `${vurl(it.video.key)}?dl=${encodeURIComponent(file)}`
      a.download = file
      a.click()
      window.open("https://x.com/intent/post?text=" + encodeURIComponent(text(0)), "_blank", "noopener")
      toast("视频开始下载了。到 X 的发帖页里把视频拖进去，检查一遍再发。", 7000)
    })
  }
}

const setupPrompt = (token) => `帮我配置 promo-kit（团队 X 宣发素材库 ${location.origin}）的上传令牌：

1. 把下面这一行写进 ~/.env。已经有 PROMO_KIT_TOKEN 的话只替换那一行，没有就追加到文件末尾。别的行不要动，不要把令牌打印出来，也不要提交进任何仓库。
PROMO_KIT_TOKEN=${token}

2. 验证：用 ~/.env 里的值跑
curl -s -o /dev/null -w '%{http_code}\\n' -H "Authorization: Bearer $PROMO_KIT_TOKEN" ${location.origin}/api/items
返回 200 就配好了。

3. 以后推素材，在 rove 仓库的 packages/promo-kit 目录里跑：
bun run kit push 视频.mp4 --title "标题" --copy copy.md
copy.md 里一条推文一段，段之间用单独一行 --- 隔开。改文案：bun run kit copy <id> --copy copy.md；下架：bun run kit rm <id>；列表：bun run kit ls。`

function renderToken() {
  document.title = "上传令牌 · 宣发素材"
  app.innerHTML = `
    <a class="back" href="#/">← 全部素材</a>
    <h1>上传令牌</h1>
    <p class="muted">想自己往素材库推视频，先生成一个令牌，再把下面的 prompt 交给你的 Claude Code / Codex，它会把令牌写进你本机的 ~/.env。令牌只显示这一次；重新生成后旧令牌立刻作废。</p>
    <div class="row"><button class="primary" id="mint">生成我的令牌</button></div>
    <div id="out"></div>`
  const btn = app.querySelector("#mint")
  btn.addEventListener("click", async () => {
    btn.disabled = true
    try {
      const r = await fetch("/api/token", { method: "POST" })
      if (!r.ok) throw new Error(r.status + " " + (await r.text()))
      const text = setupPrompt((await r.json()).token)
      app.querySelector("#out").innerHTML = `
        <div class="post" style="margin-top:var(--space-4\.5)">
          <div class="head"><span>复制给你的 agent</span></div>
          <textarea class="prompt" readonly aria-label="配置 prompt">${esc(text)}</textarea>
          <div class="row"><button class="primary" id="cp">复制 prompt</button></div>
        </div>`
      app.querySelector("#cp").addEventListener("click", async () =>
        toast((await copy(text)) ? "已复制，粘贴给你的 agent 即可" : "复制失败，手动全选文本框复制"))
      btn.textContent = "重新生成（旧令牌会作废）"
    } catch (e) {
      toast("生成失败：" + e.message, 6000)
    } finally {
      btn.disabled = false
    }
  })
}

async function route() {
  try {
    if (!items) await load()
  } catch (e) {
    app.innerHTML = `<p class="muted">加载失败：${esc(e.message)}</p>`
    return
  }
  const id = location.hash.replace(/^#\/?/, "")
  if (id === "token") { renderToken(); scrollTo(0, 0); return }
  const it = id && items.find((x) => x.id === id)
  if (id && !it) app.innerHTML = `<p class="muted">素材不存在或已下架。<a href="#/">回到列表</a></p>`
  else if (it) renderDetail(it)
  else renderList()
  scrollTo(0, 0)
}
addEventListener("hashchange", route)
route()
</script>
</body>
</html>
