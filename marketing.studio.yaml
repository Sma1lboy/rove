# brand-studio metadata for the rove repo (skill: .agents/skills/brand-studio submodule).
# Directory contract: production is scratch under .studio/ (gitignored);
# user-accepted assets settle into packages/branding/assets/ and are recorded in
# packages/branding/assets/accepted.yaml. Brand tokens live in packages/branding/src/colors.ts.
project:
  id: rove
  root: .
  marketingRoot: packages/branding/marketing

skillDistribution:
  upstream: sma1lboy/brand-studio
  scope: repo
  ref: main

theme:
  path: packages/branding/marketing/theme.md
  references: packages/branding

campaigns:
  release: packages/branding/marketing/campaigns/release
  promo: packages/branding/marketing/campaigns/promo

skills:
  # Capability -> producer skill (installed at project scope). Producers may
  # live in their own GitHub repos wired as submodules (like brand-studio
  # itself) — the invariant is a recursive clone brings everything.
  # brand-video is the single video producer: script/reference analysis,
  # replay capture (absorbed remotion-ref-replay), composition, audio slots.
  image: gpt-image
  video: brand-video

backends:
  text-to-image:
    runner: codex-exec
    command: "codex exec --image"
    model: gpt-image-2

artifacts:
  scratch: .studio/out
  approved: packages/branding/assets

state:
  plans: packages/branding/marketing/plans
  assetIndex: packages/branding/marketing/asset-state.yaml
  accepted: packages/branding/assets/accepted.yaml
  directoryStateFile: asset-state.yaml

sources:
  assetRoots:
    - packages/branding/assets
    - docs/assets/brand
  relatedRepos: []

policy:
  requireHumanApprovalBeforeRender: true
  requireHumanApprovalBeforeStateUpdate: true
  allowRootWorkspaceBootstrap: false
