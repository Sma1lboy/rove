# Rove Mobile (packages/rove-ios): build, unit tests and UI tests on a simulator.
#
# Own file for the `paths` filter: a PR that touches neither the app nor the
# bridge it talks to starts no macOS runner. The bridge is in the filter
# because the app decodes its wire format.

name: iOS

on:
  push:
    branches: [main]
    paths:
      - "packages/rove-ios/**"
      - "packages/rove-bridge/**"
      - ".github/workflows/ios.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/rove-ios/**"
      - "packages/rove-bridge/**"
      - ".github/workflows/ios.yml"

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # macos-26 defaults to Xcode 26.6, the toolchain the app is developed with; macos-15's
    # Xcode 16 rejects Swift that 26 accepts (Optional<Bool> switches, Substring interpolation).
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Theme guard (colors only in Theme.swift)
        working-directory: packages/rove-ios
        run: scripts/lint-colors.sh

      - name: Generate project
        working-directory: packages/rove-ios
        run: xcodegen generate

      - name: Pick a simulator
        # Hosted images rename their simulators with every Xcode bump; take the first available iPhone.
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k in sorted(d, reverse=True) if 'iOS' in k for x in d[k] if x['name'].startswith('iPhone')))")
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid" || true

      - name: Start the fixture bridge
        # KeyboardStateTests read what the app sent (term.resize, term.input) back from its /log.
        run: |
          bun packages/rove-ios/scripts/fixture-bridge.ts > /tmp/fixture-bridge.log 2>&1 &
          for _ in $(seq 1 50); do
            curl -sf -H 'Authorization: Bearer fixture' http://127.0.0.1:7896/log > /dev/null && exit 0
            sleep 0.2
          done
          cat /tmp/fixture-bridge.log
          exit 1

      - name: Build and test
        working-directory: packages/rove-ios
        env:
          TEST_RUNNER_ROVE_FIXTURE_URL: ws://127.0.0.1:7896/?token=fixture
        run: |
          set -o pipefail
          xcodebuild -scheme RoveMobile -destination "id=$SIM_UDID" build test | grep -E 'error:|warning: .*RoveMobile|Test Case .*(passed|failed|skipped)|Executed|\*\* (BUILD|TEST)'
