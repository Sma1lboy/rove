# Rove Mobile (packages/rove-ios): build, unit tests and UI tests on a simulator.
#
# Own file for the `paths` filter: a PR that touches neither the app nor the
# bridge it talks to starts no macOS runner. The bridge is in the filter
# because the app decodes its wire format.

name: iOS

on:
  push:
    branches: [main]
    paths:
      - "packages/rove-ios/**"
      - "packages/rove-bridge/**"
      - ".github/workflows/ios.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/rove-ios/**"
      - "packages/rove-bridge/**"
      - ".github/workflows/ios.yml"
  # Re-run the keyboard suite on one commit to judge its stability.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # macos-26 defaults to Xcode 26.6, the toolchain the app is developed with; macos-15's
    # Xcode 16 rejects Swift that 26 accepts (Optional<Bool> switches, Substring interpolation).
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Unit tests and every UI test except KeyboardStateTests.
          - suite: app
            appearance: light
            select: -skip-testing:RoveMobileUITests/KeyboardStateTests
          # The light keyboard tests. The hardware-key test runs last, on its own (see the step below).
          - suite: keyboard
            appearance: light
            hardware: true
            select: >-
              -only-testing:RoveMobileUITests/KeyboardStateTests
              -skip-testing:RoveMobileUITests/KeyboardStateTests/testInputsFixtureDark
              -skip-testing:RoveMobileUITests/KeyboardStateTests/testInputSampleFixtureDark
              -skip-testing:RoveMobileUITests/KeyboardStateTests/testHardwareKeysReachTheTerminal
          # One dark input of each kind and the dark case of the terminal tests. The full dark sweep stalls on
          # the hosted runner (60 s app-idle waits per action, docs/KEYBOARD.md) and stays a local run.
          - suite: keyboard
            appearance: dark
            select: >-
              -only-testing:RoveMobileUITests/KeyboardStateTests/testInputSampleFixtureDark
              -only-testing:RoveMobileUITests/KeyboardStateTests/testTerminalDemo
              -only-testing:RoveMobileUITests/KeyboardStateTests/testTerminalFixture
    name: ${{ matrix.suite }} (${{ matrix.appearance }})
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Theme guard (colors only in Theme.swift)
        working-directory: packages/rove-ios
        run: scripts/lint-colors.sh

      - name: Generate project
        working-directory: packages/rove-ios
        run: xcodegen generate

      - name: Pick a simulator
        # Hosted images rename their simulators with every Xcode bump; take the first available iPhone.
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k in sorted(d, reverse=True) if 'iOS' in k for x in d[k] if x['name'].startswith('iPhone')))")
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"
          # Software keyboard, always. The hosted Simulator connects a hardware keyboard, and a simulator that has
          # seen one (HardwareKeyboardLastSeen) hides the software keyboard; the keyboard tests then find none.
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          # A never-booted simulator ignores appearance switches until it has finished a first boot and been
          # restarted. The keyboard flag is written while it is down, once the first boot has created the file.
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl shutdown "$udid"
          prefs="$HOME/Library/Developer/CoreSimulator/Devices/$udid/data/Library/Preferences/com.apple.keyboard.preferences.plist"
          [ -f "$prefs" ] || plutil -create xml1 "$prefs"
          plutil -replace HardwareKeyboardLastSeen -bool NO "$prefs"
          xcrun simctl bootstatus "$udid" -b

      - name: Start the fixture bridge
        # KeyboardStateTests read what the app sent (term.resize, term.input) back from its /log.
        run: |
          bun packages/rove-ios/scripts/fixture-bridge.ts > /tmp/fixture-bridge.log 2>&1 &
          for _ in $(seq 1 50); do
            curl -sf -H 'Authorization: Bearer fixture' http://127.0.0.1:7896/log > /dev/null && exit 0
            sleep 0.2
          done
          cat /tmp/fixture-bridge.log
          exit 1

      # The appearance is set from the host: XCUIDevice.appearance has not switched the hosted simulator.
      # ROVE_APPEARANCE tells KeyboardStateTests which theme the host chose. A test that runs past its
      # allowance fails with a hang report instead of eating the job's budget.
      - name: Build and test (${{ matrix.suite }}, ${{ matrix.appearance }})
        working-directory: packages/rove-ios
        env:
          TEST_RUNNER_ROVE_FIXTURE_URL: ws://127.0.0.1:7896/?token=fixture
          TEST_RUNNER_ROVE_APPEARANCE: ${{ matrix.appearance }}
          TEST_RUNNER_ROVE_CI: "1"
        run: |
          set -o pipefail
          xcrun simctl ui "$SIM_UDID" appearance ${{ matrix.appearance }}
          sleep 3
          xcrun simctl io "$SIM_UDID" screenshot /tmp/springboard.png
          xcodebuild -scheme RoveMobile -destination "id=$SIM_UDID" -derivedDataPath build/dd -resultBundlePath /tmp/ios.xcresult \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 1500 -maximum-test-execution-time-allowance 1800 \
            build test ${{ matrix.select }} \
            | grep --line-buffered -E 'error:|warning: .*RoveMobile|Test Case .*(passed|failed|skipped)|Executed|KB |\*\* (BUILD|TEST)'

      # Hardware key presses mark the simulator as having seen a hardware keyboard, after which it hides the
      # software keyboard, so this test runs after every other one.
      - name: Hardware keys
        if: matrix.hardware
        working-directory: packages/rove-ios
        env:
          TEST_RUNNER_ROVE_FIXTURE_URL: ws://127.0.0.1:7896/?token=fixture
          TEST_RUNNER_ROVE_APPEARANCE: ${{ matrix.appearance }}
          TEST_RUNNER_ROVE_CI: "1"
        run: |
          set -o pipefail
          xcodebuild -scheme RoveMobile -destination "id=$SIM_UDID" -derivedDataPath build/dd -resultBundlePath /tmp/ios-hw.xcresult \
            test-without-building -only-testing:RoveMobileUITests/KeyboardStateTests/testHardwareKeysReachTheTerminal \
            | grep --line-buffered -E 'error:|Test Case .*(passed|failed|skipped)|skipped -|Executed|\*\* (BUILD|TEST)'

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-${{ matrix.suite }}-${{ matrix.appearance }}
          path: |
            /tmp/ios.xcresult
            /tmp/ios-hw.xcresult
            /tmp/springboard.png
            /tmp/fixture-bridge.log
          if-no-files-found: ignore
