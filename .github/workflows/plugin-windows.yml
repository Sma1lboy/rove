name: Windows plugin acceptance
# The owner's PRs run this in `bun run pre-pr` on Windows when the paths change.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packages/rove-daemon/src/plugins/**'
      - 'packages/rove-daemon/src/client/detached-spawn.ts'
      - 'packages/rove/test/behavior/plugin-process/**'
      - 'packages/rove-harness/e2e/plugin-windows*'
      - '.github/workflows/plugin-windows.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/rove-daemon/src/plugins/**'
      - 'packages/rove-daemon/src/client/detached-spawn.ts'
      - 'packages/rove/test/behavior/plugin-process/**'
      - 'packages/rove-harness/e2e/plugin-windows*'
      - '.github/workflows/plugin-windows.yml'
permissions:
  contents: read
jobs:
  plugin-windows:
    if: github.event_name != 'pull_request' || github.event.pull_request.author_association != 'OWNER'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: Native Bun baseline and head process acceptance
        env:
          BASE_SHA: 61c4532cc642039ce4ce3f6739d1ee35f2c58cd0
        run: bun packages/rove/test/behavior/plugin-process/compare.mjs
      - name: Build the real web client
        run: bun --filter rove-web build
      - name: Install browser
        working-directory: packages/rove-harness
        run: bun x playwright install chromium
      - name: Real TUI and web baseline and head acceptance
        env:
          BASE_SHA: 61c4532cc642039ce4ce3f6739d1ee35f2c58cd0
          ROVE_PLUGIN_SCENARIO: clients
        run: bun packages/rove/test/behavior/plugin-process/compare.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-plugin-evidence
          path: plugin-evidence
