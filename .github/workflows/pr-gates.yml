# The PR gates that read the description: changeset-cap, file-size-cap, UI
# evidence. They run on pull requests from anyone but the owner, whose PRs
# pass the same gates in `bun run pre-pr -- --body-file <body>` before they
# open. By hand for any PR: `gh workflow run pr-gates.yml -f pr=N`. The
# file-size and UI gates read the PR's CURRENT body through the API, so an
# edit re-runs only these checkout-only jobs.

name: PR gates

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true

concurrency:
  group: pr-gates-${{ inputs.pr || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changeset-cap:
    # Hard rule sibling (KOB-10, docs/RELEASING.md "add a changeset per
    # user-facing change"): a PR touching the published package's source
    # must carry a `.changeset/*.md` file, or a release can silently ship
    # undocumented behavior. Escape hatch is Changesets' own, not a PR-body
    # comment: `bun run changeset -- --empty` for tooling/docs/CI-only PRs.
    if: github.event_name == 'pull_request' && github.event.pull_request.author_association != 'OWNER'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: User-facing PRs must add a changeset
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          # "User-facing" == touches published-package source. rove-daemon
          # is private/unpublished but ships bundled inside the rove CLI
          # (see docs/RELEASING.md), so it counts too; test/docs/config
          # changes in either package do not.
          touches_user_facing=0
          while IFS= read -r f; do
            case "$f" in
              packages/rove/src/*|packages/rove-daemon/src/*) touches_user_facing=1 ;;
            esac
          done < <(git diff --name-only --diff-filter=ACMR "origin/$BASE_REF"...HEAD)

          if [ "$touches_user_facing" -eq 0 ]; then
            echo "No published-package source touched — changeset gate is a no-op."
            exit 0
          fi

          has_changeset=$(git diff --name-only --diff-filter=A "origin/$BASE_REF"...HEAD -- '.changeset/*.md' | grep -v README.md || true)
          if [ -z "$has_changeset" ]; then
            echo "::error::This PR touches packages/rove/src or packages/rove-daemon/src but adds no .changeset/*.md. Run 'bun run changeset' to record the user-facing change, or 'bun run changeset -- --empty' if this is tooling-only. See docs/RELEASING.md."
            exit 1
          fi
          echo "ok — changeset(s): $has_changeset"

      # Validate the frontmatter here too, not only inside typecheck-and-test's
      # package-distribution suite. Same script the pre-commit hook runs, so
      # local and CI can't drift; running it in THIS job means a bad package
      # name is reported next to the changeset rule it violates instead of
      # surfacing as an unrelated architecture-test failure.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Changeset frontmatter is valid
        run: bun scripts/check-changeset.mjs

  file-size-cap:
    # Hard rule (docs/agents/dev-loop.md "File size"): a PR may not grow a code file
    # past ~500 lines. Only growth is gated — a legacy oversized file stays
    # green when an edit leaves it the same length or shorter.
    if: github.event_name != 'pull_request' || github.event.pull_request.author_association != 'OWNER'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.pr && format('refs/pull/{0}/head', inputs.pr) || '' }}

      - name: Touched code files must not grow past ~500 lines
        env:
          BASE_REF: main
          PR_NUMBER: ${{ inputs.pr || github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        # Exemptions are PER FILE: each `file-size-exemption: <path> — <reason>`
        # line in the PR body exempts only the exact path it names.
        run: bash scripts/file-size-check.sh

  ui-evidence:
    if: github.event_name != 'pull_request' || github.event.pull_request.author_association != 'OWNER'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Test UI evidence gate
        run: node --test scripts/ui-evidence.test.mjs

      - name: Require PR screenshots for UI changes
        uses: actions/github-script@v7
        env:
          PR: ${{ inputs.pr || github.event.pull_request.number }}
        with:
          script: |
            const { checkPullRequest } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/ui-evidence.mjs`);
            context.payload.pull_request = { number: Number(process.env.PR) };
            await checkPullRequest({ github, context, core });
