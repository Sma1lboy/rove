# The PR gates that read the description, by hand only. PRs start no cloud
# runs; `bun run pre-pr -- --body-file <body>` runs both gates locally. Run
# this for a PR whose author could not (`gh workflow run pr-gates.yml -f pr=N`).
# Both read the PR's CURRENT body through the API.

name: PR gates

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true

concurrency:
  group: pr-gates-${{ inputs.pr }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  file-size-cap:
    # Hard rule (docs/agents/dev-loop.md "File size"): a PR may not grow a code file
    # past ~500 lines. Only growth is gated — a legacy oversized file stays
    # green when an edit leaves it the same length or shorter.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: refs/pull/${{ inputs.pr }}/head

      - name: Touched code files must not grow past ~500 lines
        env:
          BASE_REF: main
          PR_NUMBER: ${{ inputs.pr }}
          GH_TOKEN: ${{ github.token }}
        # Exemptions are PER FILE: each `file-size-exemption: <path> — <reason>`
        # line in the PR body exempts only the exact path it names.
        run: bash scripts/file-size-check.sh

  ui-evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Test UI evidence gate
        run: node --test scripts/ui-evidence.test.mjs

      - name: Require PR screenshots for UI changes
        uses: actions/github-script@v7
        env:
          PR: ${{ inputs.pr }}
        with:
          script: |
            const { checkPullRequest } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/ui-evidence.mjs`);
            context.payload.pull_request = { number: Number(process.env.PR) };
            await checkPullRequest({ github, context, core });
