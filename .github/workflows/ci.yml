# Main-branch CI.
#
# Runs on every push to main, and by hand (workflow_dispatch) on any branch.
# Pull requests start no cloud runs: `bun run pre-pr` runs these suites
# locally before `gh pr create` (docs/agents/dev-loop.md "Before opening a
# PR"). This stays as the post-merge check and for the OSes a laptop lacks.
#
# Behavior tests (test/behavior/) run in their own `behavior` job: they
# drive the BUILT rove CLI black-box in a temp home with isolated daemon and
# PTY-host state (no real engine binary needed — the harness shims a fake
# `claude`). See docs/HARNESS.md "Behavioral self-test".
#
# `typecheck-and-test` keeps lint, the silent-catch gate, tsc and the build;
# its unit tests moved to the sharded `unit-tests` job when that single step
# became the long pole (91s) after the render track was sharded.
#
# `render-track` is the hard macOS gate for React/OpenTUI components: it
# mounts them and asserts on real frames, sharded 8 ways. It no longer
# enforces a line-coverage floor — line coverage says a line RAN, not that
# anything checked it, and the exemption list it needed was doing more work
# than the gate (owner call 2026-09-19). `visual-ground-truth` independently
# gates the browser → PTY → real OpenTUI journey on Linux, where the hosted
# runner grants node-pty a working pseudoterminal.
#
# The docs site moved to its own workflow (docs-site.yml) so it can carry a
# `paths` filter — it ran on every PR and cost ~60s on changes that could not
# affect it. GitHub only supports that filter at the workflow level.
#
# The PR-only gates (changeset-cap, file-size-cap, UI evidence) run in
# `bun run pre-pr`; pr-gates.yml can still run the last two by hand.

name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel in-flight CI for older pushes on the same branch — saves
# minutes when several commits land back-to-back.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14


      # No package cache here, and that is measured, not an oversight.
      #
      #                        with cache (35457217694)   without (35457430238)
      #   install average              9s                        14s
      #   job average                 46s                        41s
      #   slowest job                 67s                        59s
      #
      # The cache does make `install` faster, and still loses: restoring it
      # costs 9-10s that every job pays first. Judge this by job time, not by
      # a single run's wall clock — those two runs came out 71s and 87s, and
      # that 16s swing is queue noise, not the cache. Playwright's browser
      # cache is kept: there the download IS the cost, not a link step.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (monorepo)
        # Biome runs first because it's the cheapest check (~50ms) — fail
        # fast on style/format drift before we burn minutes on tsc + tests
        # + build. Biome at root sees all packages.
        run: bun run lint

      - name: Plugin scanner and pre-pr tests
        run: node --test scripts/scan-plugins.test.mjs scripts/pre-pr.test.mjs

      - name: No silent catch handlers in the TUI
        # Under an alternate screen a bare `console.error` in a catch reaches
        # the daemon log only, so the failed gesture looks like a no-op. Biome
        # can't express "console.error inside a catch", hence a script gate.
        run: node scripts/no-silent-catch.mjs

      - name: Typecheck (rove package)
        # Workspaces hoist deps; per-package commands run via `bun --filter`.
        run: bun run typecheck

      - name: Build (rove package)
        run: bun run build

      - name: Bridge tests (rove-bridge)
        # bun:test, not vitest: the bridge's server is Bun.serve.
        run: bun --filter rove-bridge test

      - name: WeChat channel tests (rove-weixin)
        run: bun --filter rove-weixin test

      - name: Built CLI carries the WeChat channel
        # rove-weixin is bundled into dist, not published: prove the npm
        # artifact still answers `rove weixin`.
        run: bun packages/rove/dist/cli/rove.js weixin --help | grep -q "rove weixin <login"

  unit-tests:
    # What `typecheck-and-test` used to run inline as a single 91s step — the
    # long pole once the render track was sharded. vitest shards natively, and
    # these tests are pure (no PTY, no renderer), so slicing them has none of
    # the risk the render track's PTY half has.
    #
    # Four ways, not eight: at ~23s a shard the fixed cost (checkout + install,
    # ~10s warm) starts to dominate, so more slices buy less each time.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Unit tests (rove package, shard ${{ matrix.shard }}/4)
        # Same flags as `test:fast`, plus vitest's own --shard.
        working-directory: packages/rove
        run: bun x vitest run --passWithNoTests --minWorkers=1 --maxWorkers=8 --shard=${{ matrix.shard }}/4

  behavior:
    # Black-box behavior suite: the BUILT CLI in a temp ROVE_HOME with an
    # isolated daemon + hosted PTY engine. Catches packaged-path and session
    # lifecycle regressions unit mocks cannot see.
    #
    # Three shards: at two, shard 2 ran ~45s of tests and set the wall clock.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14


      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build (rove package)
        run: bun run build

      - name: Bridge tests (rove-bridge)
        # bun:test, not vitest: the bridge's server is Bun.serve.
        run: bun --filter rove-bridge test

      - name: Behavior tests (Rove package, shard ${{ matrix.shard }}/3)
        # Same flags as `test:behavior`, plus vitest's --shard. The serial
        # pool and the retry stay INSIDE each shard: these drive the built
        # CLI black-box and are not safe to run concurrently with each
        # other, but separate runners are separate machines, so slicing
        # across jobs is.
        working-directory: packages/rove
        run: |
          ROVE_INCLUDE_BEHAVIOR=1 bun x vitest run test/behavior \
            --pool forks --minWorkers=1 --maxWorkers=1 --retry=2 \
            --passWithNoTests --shard=${{ matrix.shard }}/3

  render-track:
    # OpenTUI's native renderer runs under Bun, not Vitest's Node worker.
    #
    # Split across two platforms, because the hosted macOS concurrency limit
    # is 5 and that — not per-shard time — was setting the wall clock. Four
    # measurements, all on this repo, all with the whole suite on macOS:
    #
    #   8 shards, pty on shard 1   → queued 5+3, 60s idle  → 142s
    #   5 shards + a pty job (6)   → queued 5+1, 40s idle  → 109s
    #   4 shards + a pty job (5)   → no queue, 88s slowest →  98s
    #   5 shards, pty on shard 1   → no queue, 79s slowest →  92s
    #
    # Five was the ceiling. Linux's limit is far higher, and a full Linux run
    # (run 35453490576) passed 545 of 546 tests — so Linux takes the bulk at
    # eight shards, and `render-track-macos` runs only what Linux cannot pass
    # (test/render-linux-known-failing.txt) plus the PTY half.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Render tests (Linux, shard ${{ matrix.shard }}/8)
        working-directory: packages/rove
        run: bun scripts/render-track.mjs --platform=linux --half=main --shard=${{ matrix.shard }}/8

  render-track-macos:
    # The remainder: the files Linux cannot pass, plus the PTY half. One job,
    # one macOS slot. The PTY files are deliberately never sharded — they are
    # the one part of this suite that has deadlocked CI, and they keep their
    # own process and deadlock ceiling (PTY_TIMEOUT_MS in render-track.mjs).
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Render tests macOS holds (ratchet list + PTY half)
        working-directory: packages/rove
        run: bun scripts/render-track.mjs --platform=macos

  visual-ground-truth:
    # The hosted macOS images reject node-pty's POSIX PTY spawn before the
    # child starts. Linux compiles node-pty from source and exercises the same
    # browser → xterm → PTY → real OpenTUI contract.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14


      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build canonical Rove artifacts
        working-directory: packages/rove
        run: bun run build

      - name: Verify node-pty can create a real child terminal
        working-directory: packages/rove-harness
        run: |
          node --input-type=module <<'EOF'
          import { spawn } from "node-pty"
          const child = spawn("/bin/sh", ["-lc", "printf pty-ready"], { cols: 80, rows: 24, cwd: process.cwd(), env: process.env })
          let output = ""
          child.onData((data) => { output += data })
          child.onExit(({ exitCode }) => {
            if (exitCode === 0 && output.includes("pty-ready")) process.exit(0)
            throw new Error(`node-pty smoke failed: exit=${exitCode}, output=${JSON.stringify(output)}`)
          })
          EOF

      - name: Verify harness PTY reconnect and process-tree cleanup
        working-directory: packages/rove-harness
        run: bun run test test/pty-session-lifecycle.test.ts test/pty-tree-lifecycle.test.mjs test/pty-sidecar-shutdown.test.mjs

      # Playwright re-downloaded Chromium every run (~10s). The browser build
      # is pinned by the playwright version in the lockfile, so that is the
      # cache key: a playwright bump misses the cache and re-downloads, which
      # is exactly when it should.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-playwright-

      - name: Install Chromium for the visual ground-truth harness
        working-directory: packages/rove-harness
        run: bunx playwright install chromium

      - name: Visual journey (browser → PTY → real OpenTUI)
        working-directory: packages/rove-harness
        run: bun run visual

      - name: Upload failed visual evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-ground-truth-${{ github.run_id }}
          path: packages/rove-harness/test-results
          if-no-files-found: ignore

  clean-linux-install:
    # The packed CLI installed the way a user installs it, on a Linux box
    # with no C/C++ toolchain (a fresh WSL distro, a `rove machine add`
    # target), then one real PTY session through it. The other jobs run from
    # the workspace, where bun already installed and compiled everything.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build and pack (rove package)
        run: |
          bun run build
          mkdir -p "$RUNNER_TEMP/pkg"
          (cd packages/rove && npm pack --pack-destination "$RUNNER_TEMP/pkg")

      - name: Install in a bare ubuntu:24.04 and open a PTY
        run: |
          docker run --rm -v "$RUNNER_TEMP/pkg:/pkg:ro" -v "$PWD/scripts:/s:ro" ubuntu:24.04 \
            bash -c 'bash /s/clean-linux-install.sh /pkg/*.tgz'

  harness-windows-lifetime:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Only the harness's closure: the whole workspace is ~2000 packages and
      # took ~95s to link on Windows, against 360 in ~6s.
      - name: Install dependencies
        run: bun install --frozen-lockfile --filter rove-harness
      - name: Verify console cleanup and detached service survival
        working-directory: packages/rove-harness
        run: bun run test test/pty-session-lifecycle.test.ts test/pty-sidecar-shutdown.test.mjs
