# PR / push CI gate.
#
# Runs on every push to main and every pull request. Catches typecheck
# regressions, broken unit tests, and build failures *before* a tag
# push triggers the release workflow against a broken tree.
#
# Behavior tests (test/behavior/) run in their own `behavior` job: they
# drive the BUILT kobe CLI black-box in a temp home with isolated daemon and
# PTY-host state (no real engine binary needed — the harness shims a fake
# `claude`). See docs/HARNESS.md "Behavioral self-test".
#
# `typecheck-and-test` keeps lint, the silent-catch gate, tsc and the build;
# its unit tests moved to the sharded `unit-tests` job when that single step
# became the long pole (91s) after the render track was sharded.
#
# `render-track` is the hard macOS gate for React/OpenTUI components: it
# mounts them and asserts on real frames, sharded 8 ways. It no longer
# enforces a line-coverage floor — line coverage says a line RAN, not that
# anything checked it, and the exemption list it needed was doing more work
# than the gate (owner call 2026-09-19). `visual-ground-truth` independently
# gates the browser → PTY → real OpenTUI journey on Linux, where the hosted
# runner grants node-pty a working pseudoterminal.
#
# docs-site builds packages/kobe-docs (the public Fumadocs site at
# docs.rove.sma1lboy.me). Its content is synced from docs/, so this job is
# what keeps a Markdown edit from silently breaking the site — deployment is
# automatic on main via deploy-docs.yml.
#
# changeset-cap (PR only, KOB-10) is the changeset sibling of file-size-cap:
# a PR that touches published-package source (packages/kobe/src or
# packages/kobe-daemon/src, since kobe-daemon ships bundled inside the kobe
# CLI — see docs/RELEASING.md) must add a `.changeset/*.md` file, so a
# release can't silently ship undocumented behavior. Pure tooling/docs/CI
# changes opt out with `bun run changeset -- --empty` (docs/RELEASING.md
# "add a changeset per user-facing change") — Changesets' own escape hatch,
# not a bespoke PR-body comment.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight CI for older pushes on the same branch — saves
# minutes when several commits land back-to-back.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  file-size-cap:
    # Hard rule (AGENTS.md "File size cap"): any code file a PR touches must
    # end up ≤500 lines. Only touched files are gated, so legacy oversized
    # files stay green until someone edits them — touch it, you shrink it.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Touched code files must be ≤500 lines
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        # Cap + near-cap headroom warning; extracted to a script so the
        # gate's behavior is covered by tests. Exemptions are PER FILE:
        # each `file-size-exemption: <path> — <reason>` line in the PR body
        # exempts only the exact path it names.
        run: bash scripts/file-size-check.sh

  changeset-cap:
    # Hard rule sibling (KOB-10, docs/RELEASING.md "add a changeset per
    # user-facing change"): a PR touching the published package's source
    # must carry a `.changeset/*.md` file, or a release can silently ship
    # undocumented behavior. Escape hatch is Changesets' own, not a PR-body
    # comment: `bun run changeset -- --empty` for tooling/docs/CI-only PRs.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: User-facing PRs must add a changeset
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          # "User-facing" == touches published-package source. kobe-daemon
          # is private/unpublished but ships bundled inside the kobe CLI
          # (see docs/RELEASING.md), so it counts too; test/docs/config
          # changes in either package do not.
          touches_user_facing=0
          while IFS= read -r f; do
            case "$f" in
              packages/kobe/src/*|packages/kobe-daemon/src/*) touches_user_facing=1 ;;
            esac
          done < <(git diff --name-only --diff-filter=ACMR "origin/$BASE_REF"...HEAD)

          if [ "$touches_user_facing" -eq 0 ]; then
            echo "No published-package source touched — changeset gate is a no-op."
            exit 0
          fi

          has_changeset=$(git diff --name-only --diff-filter=A "origin/$BASE_REF"...HEAD -- '.changeset/*.md' | grep -v README.md || true)
          if [ -z "$has_changeset" ]; then
            echo "::error::This PR touches packages/kobe/src or packages/kobe-daemon/src but adds no .changeset/*.md. Run 'bun run changeset' to record the user-facing change, or 'bun run changeset -- --empty' if this is tooling-only. See docs/RELEASING.md."
            exit 1
          fi
          echo "ok — changeset(s): $has_changeset"

      # Validate the frontmatter here too, not only inside typecheck-and-test's
      # package-distribution suite. Same script the pre-commit hook runs, so
      # local and CI can't drift; running it in THIS job means a bad package
      # name is reported next to the changeset rule it violates instead of
      # surfacing as an unrelated architecture-test failure.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Changeset frontmatter is valid
        run: bun scripts/check-changeset.mjs

  typecheck-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # Bun's global package cache, keyed by the lockfile. Every job installs
      # the same closure, and each was re-downloading it: ~180s of machine
      # time per run across the matrix. The key is per-OS because the render
      # shards are macOS and everything else is Linux.
      - name: Cache bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (monorepo)
        # Biome runs first because it's the cheapest check (~50ms) — fail
        # fast on style/format drift before we burn minutes on tsc + tests
        # + build. Biome at root sees all packages.
        run: bun run lint

      - name: No silent catch handlers in the TUI
        # Under an alternate screen a bare `console.error` in a catch reaches
        # the daemon log only, so the failed gesture looks like a no-op. Biome
        # can't express "console.error inside a catch", hence a script gate.
        run: node scripts/no-silent-catch.mjs

      - name: Typecheck (kobe package)
        # Workspaces hoist deps; per-package commands run via `bun --filter`.
        run: bun run typecheck

      - name: Build (kobe package)
        run: bun run build

  unit-tests:
    # What `typecheck-and-test` used to run inline as a single 91s step — the
    # long pole once the render track was sharded. vitest shards natively, and
    # these tests are pure (no PTY, no renderer), so slicing them has none of
    # the risk the render track's PTY half has.
    #
    # Four ways, not eight: at ~23s a shard the fixed cost (checkout + install,
    # ~10s warm) starts to dominate, so more slices buy less each time.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Unit tests (kobe package, shard ${{ matrix.shard }}/4)
        # Same flags as `test:fast`, plus vitest's own --shard.
        working-directory: packages/kobe
        run: bun x vitest run --passWithNoTests --minWorkers=1 --maxWorkers=8 --shard=${{ matrix.shard }}/4

  docs-site:
    # The public docs site (packages/kobe-docs) had no CI coverage at all:
    # root `lint` and `typecheck` skip the package, and its only path to
    # production is a hand-run `bun run deploy` from a laptop — so a docs/
    # edit that breaks the site stayed green until someone deployed.
    # `build` = sync-docs.mjs + Fumadocs MDX + `next build` (which also runs
    # tsc); the sync script has no try/catch, so it fails the job when a
    # SECTIONS entry points at a renamed/missing docs/ file, a synced page
    # loses the H1 its title comes from, or a referenced docs/assets/ image
    # is gone. It does NOT catch a new docs/ page that was never added to
    # SECTIONS (silently unsynced) or a dead cross-link (rewritten to a
    # GitHub blob URL) — those still need review. ~11s locally.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # Bun's global package cache, keyed by the lockfile. Every job installs
      # the same closure, and each was re-downloading it: ~180s of machine
      # time per run across the matrix. The key is per-OS because the render
      # shards are macOS and everything else is Linux.
      - name: Cache bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build docs site (sync + next build)
        run: bun run --filter @sma1lboy/kobe-docs build

  behavior:
    # Black-box behavior suite: the BUILT CLI in a temp KOBE_HOME with an
    # isolated daemon + hosted PTY engine. Catches packaged-path and session
    # lifecycle regressions unit mocks cannot see.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # Bun's global package cache, keyed by the lockfile. Every job installs
      # the same closure, and each was re-downloading it: ~180s of machine
      # time per run across the matrix. The key is per-OS because the render
      # shards are macOS and everything else is Linux.
      - name: Cache bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build (kobe package)
        run: bun run build

      - name: Behavior tests (Rove package)
        run: bun run --filter @sma1lboy/rove test:behavior

  render-track:
    # OpenTUI's native renderer runs under Bun, not Vitest's Node worker.
    #
    # Sharded 8 ways because the suite is genuinely expensive, not because the
    # runner is slow: 230s locally against 235s here (measured 2026-09-19).
    # Ubuntu was tried and is SLOWER (291s, run 35453490576), so the platform
    # is not the lever. Coverage instrumentation is not the lever either: the
    # same shard costs 49.2s with `--coverage` and 49.4s without.
    #
    # `--shard=i/8` slices the main half ROUND-ROBIN — neighbouring files are
    # the same feature area and cost alike, so contiguous blocks would make
    # one shard the long pole. The PTY half is not sharded: 7 files, ~13s, and
    # it is the one part of this suite that has deadlocked CI, so it runs
    # once, on shard 1.
    runs-on: macos-14
    strategy:
      # One slice failing must not cancel the others, or a rerun tells you
      # about one file at a time.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    # Hung runners, not failing tests, were eating 40min waits (2026-08-02
    # twice): the gate should fail fast so a rerun is cheap.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # Bun's global package cache, keyed by the lockfile. Every job installs
      # the same closure, and each was re-downloading it: ~180s of machine
      # time per run across the matrix. The key is per-OS because the render
      # shards are macOS and everything else is Linux.
      - name: Cache bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Render tests (kobe package, shard ${{ matrix.shard }}/8)
        working-directory: packages/kobe
        run: bun scripts/render-track.mjs --shard=${{ matrix.shard }}/8

  visual-ground-truth:
    # The hosted macOS images reject node-pty's POSIX PTY spawn before the
    # child starts. Linux compiles node-pty from source and exercises the same
    # browser → xterm → PTY → real OpenTUI contract.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # Bun's global package cache, keyed by the lockfile. Every job installs
      # the same closure, and each was re-downloading it: ~180s of machine
      # time per run across the matrix. The key is per-OS because the render
      # shards are macOS and everything else is Linux.
      - name: Cache bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build canonical Rove artifacts
        working-directory: packages/kobe
        run: bun run build

      - name: Verify node-pty can create a real child terminal
        working-directory: packages/kobe-harness
        run: |
          node --input-type=module <<'EOF'
          import { spawn } from "node-pty"
          const child = spawn("/bin/sh", ["-lc", "printf pty-ready"], { cols: 80, rows: 24, cwd: process.cwd(), env: process.env })
          let output = ""
          child.onData((data) => { output += data })
          child.onExit(({ exitCode }) => {
            if (exitCode === 0 && output.includes("pty-ready")) process.exit(0)
            throw new Error(`node-pty smoke failed: exit=${exitCode}, output=${JSON.stringify(output)}`)
          })
          EOF

      - name: Install Chromium for the visual ground-truth harness
        working-directory: packages/kobe-harness
        run: bunx playwright install chromium

      - name: Visual journey (browser → PTY → real OpenTUI)
        working-directory: packages/kobe-harness
        run: bun run visual

      - name: Upload failed visual evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-ground-truth-${{ github.run_id }}
          path: packages/kobe-harness/test-results
          if-no-files-found: ignore
