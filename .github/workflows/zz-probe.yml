name: zz-probe
on:
  push:
    branches: [dryrun/release-pr-probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { ref: main, fetch-depth: 1 }
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # non-"v" name on purpose: release.yml triggers on v* tags.
          git tag "zz-probe-tag-${GITHUB_RUN_ID}"
          git push origin "zz-probe-tag-${GITHUB_RUN_ID}" && echo "PUSH_TAG=ok" || echo "PUSH_TAG=FAILED"
          git push origin --delete "zz-probe-tag-${GITHUB_RUN_ID}" && echo "DELETE_TAG=ok" || echo "DELETE_TAG=blocked"
