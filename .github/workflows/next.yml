# Next channel: publish every push to `main` that changes the package to the
# npm `next` dist-tag. A push that touches none of what `@sma1lboy/rove` is
# built from (docs, the landing page, the native apps, other workflows)
# starts no run and publishes nothing.
#
# Same shape as nightly.yml (no commit, never moves `latest`),
# but per merge instead of per day, and gated only by the fast tier — the
# checks `bun run pre-pr` runs: lint, typecheck, unit tests, build. The full
# ci.yml suite (behavior, render, visual, cross-OS) runs only on the
# stable path (changesets.yml / scripts/release.sh).
#
#   - Version: `<next stable version>-next.<run_number>`, computed by
#     scripts/next-version.mjs from the pending changesets (or current+patch)
#     and stamped into the checkout only. It sorts BELOW the release it
#     anticipates, so stable users and `next` users roll forward cleanly.
#   - Concurrency: a burst of merges publishes only the newest; a cancelled
#     run publishes nothing. A rerun of a superseded commit also publishes
#     nothing (the HEAD check below), so `next` never moves backwards.
#   - The `chore: release` commit changesets.yml pushes uses GITHUB_TOKEN, so
#     it does not fire this workflow; the stable version it carries is
#     reached through `latest`, not `next`.
#   - Publishes ONLY @sma1lboy/rove (the compat aliases and the plugin SDK
#     ride stable releases).
#   - Releases page: every published build gets its own prerelease entry,
#     tagged `v<version>`, listing the changesets it adds over the previous
#     build. Never marked Latest. The tag is created with GITHUB_TOKEN, so it
#     does not fire release.yml. The app's version picker lists `vX.Y.Z`
#     only; its update notes show these entries to a build on `next`. A
#     failure here does not fail the run: the npm publish already happened.

name: Next

on:
  push:
    branches: [main]
    # What the package is built from (packages/rove/scripts/build.ts). Keep in step with SHIPPED below.
    paths:
      - "packages/rove/**"
      - "packages/rove-daemon/**"
      - "packages/rove-bridge/**"
      - "packages/rove-web/**"
      - "packages/rove-harness/**"
      - "packages/rove-plugin-sdk/**"
      - "packages/rove-weixin/**"
      - ".agents/skills/rove/**"
      - "scripts/voice/**"
      - "bun.lock"
      - "scripts/next-version.mjs"
      - ".github/workflows/next.yml"
  workflow_dispatch:

env:
  # The same set as `paths` above, as git pathspecs.
  SHIPPED: >-
    packages/rove packages/rove-daemon packages/rove-bridge packages/rove-web packages/rove-harness
    packages/rove-plugin-sdk packages/rove-weixin .agents/skills/rove scripts/voice bun.lock
    scripts/next-version.mjs .github/workflows/next.yml

permissions:
  contents: read

concurrency:
  group: next-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # npm provenance (OIDC)
      contents: write # each build's tag and Releases-page entry
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        working-directory: packages/rove
        run: bun run test

      - name: Compute the next version
        id: version
        run: echo "version=$(node scripts/next-version.mjs "$GITHUB_RUN_NUMBER")" >> "$GITHUB_OUTPUT"

      - name: Stamp the version (working tree only — never committed)
        working-directory: packages/rove
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node -e "
            const fs = require('fs')
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
            pkg.version = process.env.VERSION
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n')
          "
          echo "stamped $VERSION"

      - name: Build
        run: bun run build

      - name: Check the build reports the stamped version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          got=$(node packages/rove/dist/cli/rove.js --version)
          [ "$got" = "rove $VERSION" ] || { echo "build reports '$got', expected 'rove $VERSION'" >&2; exit 1; }

      - name: Configure npm auth
        run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to the next dist-tag
        id: publish
        working-directory: packages/rove
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Superseded (a newer merge changed the package while this ran, or
          # this is a rerun of an old commit): the newer run owns the tag. A
          # newer merge that left the package alone started no run, so this
          # one still publishes.
          git fetch --quiet origin main
          # shellcheck disable=SC2086 # SHIPPED is a list of pathspecs
          if [ "$GITHUB_EVENT_NAME" = "push" ] && ! git diff --quiet "$GITHUB_SHA" origin/main -- $SHIPPED; then
            echo "main changed the package after $GITHUB_SHA — the newer run publishes; nothing to do"
            exit 0
          fi
          if npm view "@sma1lboy/rove@$VERSION" version >/dev/null 2>&1; then
            echo "@sma1lboy/rove@$VERSION already published — nothing to do"
            exit 0
          fi
          # --ignore-scripts: prepublishOnly re-runs typecheck+build, which
          # already ran above against this exact tree.
          npm publish --access public --provenance --ignore-scripts --tag next
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Show the build on the Releases page
        if: steps.publish.outputs.published == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # What this build adds: the changesets that appeared since the previous next build
          # (since the last stable release for the first build after one).
          git fetch --quiet --tags origin
          prev="$(git tag --list 'v*-next.*' --sort=-creatordate | head -n 1)"
          [ -n "$prev" ] || prev="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)"
          mkdir -p "$RUNNER_TEMP/new-changesets"
          if [ -n "$prev" ]; then
            git diff --name-only --diff-filter=A "$prev" "$GITHUB_SHA" -- '.changeset/*.md' |
              while read -r file; do cp "$file" "$RUNNER_TEMP/new-changesets/"; done
          fi
          node scripts/next-version.mjs --notes "$VERSION" --changeset-dir "$RUNNER_TEMP/new-changesets" \
            > "$RUNNER_TEMP/next-notes.md"
          gh release create "v$VERSION" --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "v$VERSION" --notes-file "$RUNNER_TEMP/next-notes.md"
