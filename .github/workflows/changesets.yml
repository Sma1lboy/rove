# Cut a release from the changesets that have accumulated on main.
#
# ON DEMAND, not on every push. Merging a PR banks its changeset; a release
# happens when someone runs this workflow (or scripts/release.sh), and it
# consumes everything banked since the last one. That makes a version a
# reviewed batch rather than a per-PR side effect — the previous behaviour
# shipped ~10 versions a day, so "which build are they on" had a different
# answer per user and no released combination had been exercised as a whole.
#
# What runs here is otherwise unchanged from the automatic version:
#
#   1. Wait for HEAD's ci.yml run to go green (the full Linux/macOS gate
#      set). A red or cancelled run releases nothing.
#   2. `bun run ci:version` — changeset version + lockfile refresh +
#      lint:fix — then verify with `bun install --frozen-lockfile` and the
#      lint gate, so the bookkeeping commit can't be the thing that breaks.
#   3. Commit `chore: release — X.Y.Z` on a `release/vX.Y.Z` branch, open a
#      PR, and merge it. `main`'s ruleset refuses a direct push ("Changes
#      must be made through a pull request"), so the bookkeeping commit
#      travels the same road as every other change.
#   4. Tag the SQUASHED commit — the merge rewrites the sha, so the tag is
#      read back from the merged PR, never taken from the branch.
#   5. Dispatch release.yml on the tag (a GITHUB_TOKEN tag push never
#      fires the tag trigger — GitHub's recursion guard; workflow_dispatch
#      is the documented exception). release.yml re-runs every publish
#      gate from the tag checkout before npm sees anything.
#
# The merge needs the ruleset to let this workflow's actor past the review
# requirement (bypass mode `pull_request`: still a PR, no human approval) —
# a bot PR has nobody to review it, and `--admin` would need an admin PAT
# in secrets. Without that bypass the merge step fails loudly rather than
# leaving a release half-cut.
#
# The daily automated cut still exists, on the nightly channel
# (nightly.yml → npm dist-tag `nightly`), so `main` stays continuously
# installable for anyone who opts in with `rove update nightly` without
# that being what every user receives.
#
# scripts/release.sh does the same thing locally, with an interactive
# confirm. Don't run both on the same version: they'd race to tag it.

name: Changesets

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Serialize, never cancel: back-to-back merges queue, and a superseded
  # run defers to the newer one via the guards below.
  group: changesets-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the release branch + tag
      pull-requests: write # open and merge the release PR
      actions: write # dispatch release.yml
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Decide what this run needs
        id: gate
        run: |
          # Deliberately no "main moved past $GITHUB_SHA → skip" guard here.
          # That existed for the push trigger, where a newer push had its own
          # run to defer to. On workflow_dispatch nothing follows: a merge
          # landing between clicking Run and this checkout would make the
          # release silently do nothing. Releasing whatever main's HEAD is
          # now is both what was asked for and what gets verified below.
          PENDING=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | wc -l | tr -d ' ')
          VERSION=$(node -p "require('./packages/kobe/package.json').version")
          if [ "$PENDING" != "0" ]; then
            echo "$PENDING pending changeset(s) — releasing"
            echo "mode=release" >> "$GITHUB_OUTPUT"
          elif ! git ls-remote --tags origin "refs/tags/v$VERSION" | grep -q .; then
            # A committed-but-untagged version: an interrupted earlier run
            # (or a manual release.sh push). Finish it.
            echo "v$VERSION committed but untagged — resuming"
            echo "mode=resume" >> "$GITHUB_OUTPUT"
            echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "no pending changesets, v$VERSION already tagged — nothing to do"
            echo "mode=skip" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for the released commit's ci.yml to go green
        if: steps.gate.outputs.mode == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Watch the run for the commit being RELEASED — main's HEAD as
          # checked out above — not $GITHUB_SHA, which on a dispatch is
          # whatever main pointed at when the run was queued.
          SHA=$(git rev-parse HEAD)
          run_id=""
          tries=0
          while [ -z "$run_id" ]; do
            tries=$((tries + 1))
            if [ "$tries" -gt 36 ]; then
              echo "::error::no ci.yml run appeared for $SHA within ~3min"
              exit 1
            fi
            sleep 5
            run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow=ci.yml --branch main \
              --limit 15 --json databaseId,headSha \
              --jq ".[] | select(.headSha == \"$SHA\") | .databaseId" | head -1)
          done
          echo "watching ci.yml run $run_id"
          if ! gh run watch --repo "$GITHUB_REPOSITORY" "$run_id" --exit-status >/dev/null; then
            concl=$(gh run view --repo "$GITHUB_REPOSITORY" "$run_id" --json conclusion --jq .conclusion)
            # A cancelled run is a FAILED release now, not a deferral. Under
            # the push trigger a newer push had its own run to hand off to;
            # a dispatch has no successor, so exiting 0 here would report
            # success for a release that never happened.
            echo "::error::ci.yml $concl on $SHA — nothing released. Land a fix, then run this workflow again."
            exit 1
          fi
          echo "green=true" >> "$GITHUB_OUTPUT"
        id: ci

      - name: Setup Bun
        if: steps.ci.outputs.green == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Version, verify, merge the release PR, tag
        if: steps.ci.outputs.green == 'true'
        id: version
        env:
          # @changesets/changelog-github resolves each changeset's PR + author
          # through the GitHub API while `changeset version` runs.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bun install --frozen-lockfile
          bun run ci:version
          NEW=$(node -p "require('./packages/kobe/package.json').version")
          TAG="v$NEW"
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
            echo "::error::$TAG already exists on origin — changesets produced a version that's already tagged"
            exit 1
          fi
          # The bookkeeping delta must not be what breaks the publish gates.
          bun install --frozen-lockfile
          bun run lint
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Same explicit path list as scripts/release.sh — never git add -A.
          git add packages/*/package.json packages/*/CHANGELOG.md .changeset
          if ! git diff --quiet bun.lock 2>/dev/null; then
            git add bun.lock
          fi
          git commit -m "chore: release — $NEW"
          BRANCH="release/$TAG"
          # Force: a previous interrupted run may have left this branch
          # behind, and it carries nothing but the bookkeeping commit.
          git push --force origin "HEAD:refs/heads/$BRANCH"
          PR=$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
            --title "chore: release — $NEW" \
            --body "Version bookkeeping for $TAG: changesets consumed, package versions and CHANGELOGs written, lockfile refreshed. Generated by the Changesets workflow; the tag and npm publish follow this merge.")
          echo "opened $PR"
          # Merge synchronously. A release must not be left half-cut waiting
          # on a review nobody will give, so a refusal here fails the run.
          # A non-zero exit is not proof the merge failed: `--delete-branch`
          # reports branch-cleanup failures the same way, with the PR already
          # merged. Ask the PR what happened before calling it a failure.
          if ! gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --squash --delete-branch; then
            if [ "$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json state --jq .state)" != "MERGED" ]; then
              echo "::error::could not merge $PR — main's ruleset needs this workflow's actor in bypass_actors with bypass_mode 'pull_request'. Nothing was tagged."
              exit 1
            fi
            echo "$PR merged; the branch cleanup is what failed — continuing"
          fi
          # The squash rewrites the sha: tag what actually landed on main,
          # never the branch commit that no longer exists.
          MERGED=""
          for _ in $(seq 1 30); do
            MERGED=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json mergeCommit --jq '.mergeCommit.oid // empty')
            [ -n "$MERGED" ] && break
            sleep 4
          done
          if [ -z "$MERGED" ]; then
            echo "::error::$PR reports no merge commit — main may have the release commit without a tag; re-run this workflow to resume."
            exit 1
          fi
          git fetch origin main
          git tag "$TAG" "$MERGED"
          git push origin "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Dispatch the publish pipeline
        if: steps.gate.outputs.mode == 'resume' || steps.version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag || steps.gate.outputs.tag }}
        run: |
          # Resume case: the tag may not exist yet (interrupted run) —
          # create it at HEAD if absent, then dispatch.
          if ! git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
            git tag "$TAG"
            git push origin "$TAG"
          fi
          # A user-pushed tag (scripts/release.sh) already fired release.yml
          # via the tag trigger — dispatching again would double-publish
          # into an npm E409. Only dispatch when no run exists for this tag.
          if gh run list --repo "$GITHUB_REPOSITORY" --workflow=release.yml --limit 20 \
              --json headBranch --jq ".[] | select(.headBranch == \"$TAG\")" | grep -q .; then
            echo "release.yml already ran (or is running) for $TAG — not dispatching again"
            exit 0
          fi
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "refs/tags/$TAG"
          echo "dispatched release.yml on $TAG"
